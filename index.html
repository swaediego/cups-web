<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>cups · Tasas BCV</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Calculadora de dólares, euros y bolívares con la tasa oficial del BCV.">
<meta name="theme-color" content="#ffffff">
<meta name="color-scheme" content="light dark">
<script>
  // Tema antes de pintar (evita el parpadeo): la elección guardada, o el del sistema la primera vez
  (function () {
    var t = null;
    try { t = localStorage.getItem("cups.theme"); } catch (e) {}
    if (t !== "dark" && t !== "light") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    document.documentElement.dataset.theme = t;
    var m = document.querySelector('meta[name="theme-color"]');
    if (m) m.content = t === "dark" ? "#0b1220" : "#ffffff";
  })();
</script>

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="cups">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">

<link rel="preload" href="fonts/manrope.ttf" as="font" type="font/ttf" crossorigin>
<link rel="stylesheet" href="styles.css">
</head>
<body data-cur="USD">
<div class="app">

  <header class="header">
    <h1 class="brand">cups</h1>
    <div class="info-wrap">
      <button class="icon-btn" id="info" type="button" aria-label="Información de la app" aria-haspopup="dialog" aria-expanded="false" aria-controls="infoCard">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9.5"/><path d="M12 11v6"/><circle cx="12" cy="7.4" r="0.9" fill="currentColor" stroke="none"/></svg>
      </button>
      <div class="info-card" id="infoCard" role="dialog" aria-label="Información de la app">
        <strong class="info-name">cups</strong>
        <span class="info-version" id="infoVersion"></span>
      </div>
    </div>
    <button class="icon-btn" id="theme" type="button" aria-label="Tema: automático" title="Tema: automático">
      <svg class="auto" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5a8.5 8.5 0 0 1 0 17Z" fill="currentColor"/></svg>
      <svg class="moon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5a8.5 8.5 0 1 0 10.7 10.7Z"/></svg>
      <svg class="sun" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>
    </button>
    <button class="icon-btn" id="refresh" type="button" aria-label="Actualizar tasas">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M19.5 3v4.5H15"/>
      </svg>
    </button>
  </header>

  <section class="datebar-wrap" aria-label="Fecha de la tasa">
    <div class="datebar">
      <button class="nav-btn" id="prev" type="button" aria-label="Tasa del día anterior">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 5 7.5 12l7 7"/></svg>
      </button>

      <div class="date-center">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="4.5" width="18" height="16" rx="3.5"/><path d="M3 10h18M8 2.5v4M16 2.5v4"/>
        </svg>
        <span class="date-text">
          <span class="date-label" id="dateLabel">Cargando…</span>
          <span class="date-value" id="dateValue">—</span>
        </span>
        <input class="date-input" id="datePick" type="date" aria-label="Elegir fecha de la tasa">
      </div>

      <button class="nav-btn" id="next" type="button" aria-label="Tasa del día siguiente">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9.5 5 7 7-7 7"/></svg>
        <span class="badge" id="badge" hidden></span>
      </button>
    </div>
    <button class="link-btn" id="goToday" type="button" hidden>Volver a la tasa de hoy</button>
  </section>

  <section class="tiles" role="tablist" aria-label="Moneda">
    <button class="tile" role="tab" data-cur="USD" aria-selected="true" type="button">
      <span class="tile-top"><span class="coin coin-usd">$</span><span class="tile-name">Dólar</span></span>
      <span class="tile-rate" id="rateUSD">—</span>
      <span class="tile-date" id="dateUSD"></span>
    </button>
    <button class="tile" role="tab" data-cur="EUR" aria-selected="false" type="button">
      <span class="tile-top"><span class="coin coin-eur">€</span><span class="tile-name">Euro</span></span>
      <span class="tile-rate" id="rateEUR">—</span>
      <span class="tile-date" id="dateEUR"></span>
    </button>
    <button class="tile" role="tab" data-cur="USDT" aria-selected="false" type="button">
      <span class="tile-top"><span class="coin coin-usdt">₮</span><span class="tile-name">USDT</span></span>
      <span class="tile-rate" id="rateUSDT">—</span>
      <span class="tile-date" id="dateUSDT"></span>
    </button>
  </section>

  <section class="change" id="change" data-tone="flat" aria-live="polite">
    <p class="change-empty" id="changeEmpty">Sin dato anterior para comparar</p>
    <div class="change-body" id="changeBody" hidden>
      <div class="change-text">
        <span class="change-top" id="changeTop"></span>
        <span class="change-main" id="changeMain"></span>
      </div>
      <span class="change-pct" id="changePct"></span>
    </div>
  </section>

  <div class="modes" role="group" aria-label="Modo">
    <button class="mode-btn" data-mode="convert" aria-selected="true" type="button">Convertir</button>
    <button class="mode-btn" data-mode="calc" aria-selected="false" type="button">Calculadora</button>
  </div>

  <section class="calc" id="conv" aria-label="Convertidor">
    <div class="row" data-field="foreign">
      <div class="row-main">
        <div class="row-label">
          <span class="coin coin-sm" id="foreignCoin">$</span>
          <label for="foreignInput" id="foreignName">Dólar</label>
          <span class="copied" id="copiedForeign" aria-live="polite"></span>
        </div>
        <input class="amount" id="foreignInput" type="text" inputmode="decimal" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="0,00" maxlength="14">
      </div>
      <button class="copy-btn" id="copyForeign" type="button" aria-label="Copiar Dólar" disabled></button>
    </div>

    <div class="sep"><span class="rate-pill" id="ratePill">—</span></div>

    <div class="row" data-field="bs">
      <div class="row-main">
        <div class="row-label">
          <span class="coin coin-sm coin-bs">Bs</span>
          <label for="bsInput">Bolívares</label>
          <span class="copied" id="copiedBs" aria-live="polite"></span>
        </div>
        <input class="amount" id="bsInput" type="text" inputmode="decimal" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="0,00" maxlength="14">
      </div>
      <button class="copy-btn" id="copyBs" type="button" aria-label="Copiar Bolívares" disabled></button>
    </div>
  </section>

  <section class="pad" id="pad" aria-label="Calculadora" hidden>
    <div class="pad-head">
      <span class="dir" id="dir">Bs → $</span>
      <span class="pad-rate" id="padRate"></span>
    </div>
    <div class="expr" id="expr" data-size="l">0</div>
    <div class="converted" id="converted" aria-live="polite">$ 0,00</div>
    <div class="keys" id="keys">
      <button class="key key-c" data-k="C" type="button" aria-label="Borrar todo">AC</button>
      <button class="key key-op" data-k="⇄" type="button" aria-label="Invertir conversión">⇄</button>
      <button class="key key-back" data-k="⌫" type="button" aria-label="Borrar un dígito, mantener para borrar todo">⌫</button>
      <button class="key key-op" data-k="÷" type="button" aria-label="Dividir">÷</button>
      <button class="key key-op" data-k="(" type="button" aria-label="Abrir paréntesis">(</button>
      <button class="key key-op" data-k=")" type="button" aria-label="Cerrar paréntesis">)</button>
      <button class="key key-op" data-k="%" type="button" aria-label="Porcentaje">%</button>
      <button class="key key-op" data-k="×" type="button" aria-label="Multiplicar">×</button>
      <button class="key" data-k="7" type="button">7</button>
      <button class="key" data-k="8" type="button">8</button>
      <button class="key" data-k="9" type="button">9</button>
      <button class="key key-op" data-k="−" type="button" aria-label="Restar">−</button>
      <button class="key" data-k="4" type="button">4</button>
      <button class="key" data-k="5" type="button">5</button>
      <button class="key" data-k="6" type="button">6</button>
      <button class="key key-op" data-k="+" type="button" aria-label="Sumar">+</button>
      <button class="key" data-k="1" type="button">1</button>
      <button class="key" data-k="2" type="button">2</button>
      <button class="key" data-k="3" type="button">3</button>
      <button class="key key-eq" data-k="=" type="button" aria-label="Igual">=</button>
      <button class="key key-zero" data-k="0" type="button">0</button>
      <button class="key" data-k="," type="button" aria-label="Coma decimal">,</button>
    </div>
  </section>

  <button class="pill" id="clearConv" type="button" hidden>Reiniciar</button>

  <p class="status" id="status" role="status" hidden></p>

  <aside class="install" id="install" hidden>
    <div class="install-text">
      <strong>Instala cups en tu teléfono</strong>
      <span id="installBody"></span>
    </div>
    <button class="install-action" id="installBtn" type="button" hidden>Instalar</button>
    <button class="install-close" id="installClose" type="button" aria-label="Cerrar aviso">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
  </aside>
</div>
<div class="scrim" id="infoScrim"></div>

<script src="app.js"></script>
</body>
</html>
